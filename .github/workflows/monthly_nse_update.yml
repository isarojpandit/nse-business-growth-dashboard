name: Monthly NSE Data Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-nse-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Validate required NSE data files
        run: |
          python - <<'PY'
          from pathlib import Path

          required_files = [
              Path("data/processed/clean_nse_business_growth_from_nse.csv"),
              Path("data/exports/final_raw_nse_daily_trading_days.csv"),
              Path("data/nse_business_growth.db"),
          ]

          missing = [str(path) for path in required_files if not path.exists()]

          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          print("All required data files exist.")
          PY

      - name: Validate NSE main dataset
        run: |
          python - <<'PY'
          import pandas as pd

          main_path = "data/processed/clean_nse_business_growth_from_nse.csv"

          df = pd.read_csv(main_path, keep_default_na=False)

          required_columns = [
              "segment",
              "instrument",
              "year",
              "month_label",
              "month_date",
              "calendar_quarter",
              "financial_year",
              "financial_quarter",
              "turnover",
              "volume",
              "mom_turnover_change",
              "mom_volume_change",
          ]

          missing_columns = [col for col in required_columns if col not in df.columns]

          if missing_columns:
              raise SystemExit(f"Main dataset missing columns: {missing_columns}")

          df["month_date"] = pd.to_datetime(df["month_date"], errors="coerce")

          if df["month_date"].isna().any():
              bad_rows = df[df["month_date"].isna()].head(10)
              raise SystemExit(f"Invalid month_date values found:\n{bad_rows}")

          duplicate_count = df.duplicated(
              subset=["segment", "instrument", "month_label"]
          ).sum()

          if duplicate_count:
              raise SystemExit(f"Duplicate main keys found: {duplicate_count}")

          expected_groups = {
              ("Capital Market", "NA"),
              ("Currency Derivatives", "Futures"),
              ("Currency Derivatives", "Options"),
              ("Equity Derivatives", "Futures"),
              ("Equity Derivatives", "Options"),
              ("Interest Rate Derivatives", "NA"),
          }

          actual_groups = set(zip(df["segment"], df["instrument"]))

          missing_groups = expected_groups - actual_groups

          if missing_groups:
              raise SystemExit(f"Missing segment/instrument groups: {sorted(missing_groups)}")

          latest_month = df["month_date"].max()

          latest_df = df[df["month_date"] == latest_month]

          latest_groups = set(zip(latest_df["segment"], latest_df["instrument"]))

          missing_latest_groups = expected_groups - latest_groups

          if missing_latest_groups:
              raise SystemExit(
                  "Latest month is incomplete. "
                  f"Latest month: {latest_month.strftime('%b-%Y')}, "
                  f"missing groups: {sorted(missing_latest_groups)}"
              )

          print("Main dataset validation passed.")
          print(f"Rows: {len(df)}")
          print(f"Latest complete month: {latest_month.strftime('%b-%Y')}")
          print()
          print(
              df.groupby(["segment", "instrument"])["month_date"]
              .agg(["count", "min", "max"])
              .reset_index()
              .to_string(index=False)
          )
          PY

      - name: Validate NSE raw evidence dataset
        run: |
          python - <<'PY'
          import pandas as pd

          main_path = "data/processed/clean_nse_business_growth_from_nse.csv"
          raw_path = "data/exports/final_raw_nse_daily_trading_days.csv"

          main_df = pd.read_csv(main_path, keep_default_na=False)
          raw_df = pd.read_csv(raw_path, keep_default_na=False)

          required_raw_columns = [
              "segment",
              "instrument",
              "month_label",
          ]

          missing_raw_columns = [
              col for col in required_raw_columns
              if col not in raw_df.columns
          ]

          if missing_raw_columns:
              raise SystemExit(f"Raw dataset missing columns: {missing_raw_columns}")

          main_keys = set(
              zip(
                  main_df["segment"].astype(str),
                  main_df["instrument"].astype(str),
                  main_df["month_label"].astype(str),
              )
          )

          raw_keys = set(
              zip(
                  raw_df["segment"].astype(str),
                  raw_df["instrument"].astype(str),
                  raw_df["month_label"].astype(str),
              )
          )

          extra_raw_keys = raw_keys - main_keys

          if extra_raw_keys:
              sample = sorted(extra_raw_keys)[:20]
              raise SystemExit(
                  "Raw dataset contains keys not present in main dataset. "
                  f"Sample: {sample}"
              )

          print("Raw evidence validation passed.")
          print(f"Raw rows: {len(raw_df)}")
          print()
          print(
              raw_df.groupby(["segment", "instrument"])
              .size()
              .reset_index(name="rows")
              .to_string(index=False)
          )
          PY

      - name: Validate SQLite database
        run: |
          python - <<'PY'
          import sqlite3
          import pandas as pd
          from pathlib import Path

          db_path = Path("data/nse_business_growth.db")
          main_path = Path("data/processed/clean_nse_business_growth_from_nse.csv")

          main_df = pd.read_csv(main_path, keep_default_na=False)

          with sqlite3.connect(db_path) as conn:
              db_df = pd.read_sql_query(
                  "SELECT * FROM nse_business_growth",
                  conn,
              )

          if len(db_df) != len(main_df):
              raise SystemExit(
                  f"SQLite row count mismatch. "
                  f"CSV rows={len(main_df)}, DB rows={len(db_df)}"
              )

          db_required_columns = [
              "segment",
              "instrument",
              "year",
              "month_label",
              "month_date",
              "calendar_quarter",
              "financial_year",
              "financial_quarter",
              "turnover",
              "volume",
              "mom_turnover_change",
              "mom_volume_change",
          ]

          missing_db_columns = [
              col for col in db_required_columns
              if col not in db_df.columns
          ]

          if missing_db_columns:
              raise SystemExit(f"SQLite table missing columns: {missing_db_columns}")

          print("SQLite validation passed.")
          print(f"SQLite rows: {len(db_df)}")
          PY