name: CI - NSE Dashboard Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check project structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -f dashboard/app.py
          test -f scripts/run_pipeline.py
          test -f src/transformation/clean_data.py
          test -f src/utils/validation.py
          test -f src/storage/load_to_db.py

      - name: Compile Python files
        run: |
          python -m compileall config dashboard scripts src

      - name: Import dashboard app
        run: |
          python -c "import dashboard.app; print('Dashboard import successful')"

      - name: Import pipeline
        run: |
          python -c "from scripts.run_pipeline import run_pipeline; print('Pipeline import successful')"